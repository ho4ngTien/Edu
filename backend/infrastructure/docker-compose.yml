services:
  # --- DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: edu-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edu-network
    restart: unless-stopped

  # --- BACKEND ---
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: edu-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: edu-frontend
    ports:
      - "80:80"      # Standard HTTP port
      - "5173:80"    # Fallback to Vite dev port in case port 80 is occupied
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edu-network

networks:
  edu-network:
    driver: bridge

volumes:
  postgres_data:
