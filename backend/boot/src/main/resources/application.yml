spring:
  application:
    name: edu

  profiles:
    default: local

  main:
    banner-mode: console

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EduHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    default-schema: public
    schemas:
      - public
      - identity
      - organization
      - configuration
      - people
      - curriculum
      - academic
      - enrollment
      - teaching
      - attendance
      - assessment
      - certification
      - rule_engine
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.edu: INFO

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://edu.example.com}
      audience: ${JWT_AUDIENCE:edu-api}
      secret-base64: ${JWT_SECRET_BASE64:kX8vP9mN2qR5tU8x/A1bC4dE7gH0jK3mP6sV9yB2eE5=}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Organization-Id
      allow-credentials: true
